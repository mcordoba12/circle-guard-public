---
# Neo4j Deployment for CircleGuard - DEV Environment Only

apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret
  namespace: dev
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/neo4j_dev_password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: dev
  labels:
    app: neo4j
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.26-community
        ports:
        - containerPort: 7474
          name: http
        - containerPort: 7687
          name: bolt
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: neo4j-secret
              key: NEO4J_AUTH
        - name: NEO4J_dbms_memory_heap_initial__size
          value: "128m"
        - name: NEO4J_dbms_memory_heap_max__size
          value: "200m"
        - name: NEO4J_server_memory_pagecache_size
          value: "64m"
        - name: NEO4J_server_config_strict__validation_enabled
          value: "false"
        - name: NEO4J_server_bolt_listen__address
          value: "0.0.0.0:7687"
        - name: NEO4J_server_http_listen__address
          value: "0.0.0.0:7474"
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /db/neo4j/status
            port: 7474
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /db/neo4j/status
            port: 7474
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: neo4j-logs
          mountPath: /var/lib/neo4j/logs
      volumes:
      - name: neo4j-data
        emptyDir: {}
      - name: neo4j-logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: dev
  labels:
    app: neo4j
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
  - port: 7687
    targetPort: 7687
    name: bolt
  - port: 7474
    targetPort: 7474
    name: http
