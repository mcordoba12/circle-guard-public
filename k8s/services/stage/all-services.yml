---
# CircleGuard All Services - STAGE Environment
# 2 Replicas + HorizontalPodAutoscaler (min 2, max 4)
# Image tag: stage-latest

# ============================================================================
# AUTH SERVICE
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-auth-service-config
  namespace: stage
data:
  SPRING_PROFILES_ACTIVE: "stage"
  SPRING_APPLICATION_NAME: "circleguard-auth-service"
  SERVER_PORT: "8180"
  LOGGING_LEVEL_COM_CIRCLEGUARD: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-auth-service-secret
  namespace: stage
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "circleguard"
  SPRING_DATASOURCE_PASSWORD: "postgres_stage_password"
  JWT_SECRET: "stage-jwt-secret-key-circleguard-auth-service-12345"
  JWT_EXPIRATION_HOURS: "24"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-auth-service
  namespace: stage
  labels:
    app: circleguard-auth-service
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: circleguard-auth-service
  template:
    metadata:
      labels:
        app: circleguard-auth-service
        environment: stage
    spec:
      serviceAccountName: circleguard-sa
      containers:
      - name: auth-service
        image: angela912/circleguard-auth-service:stage-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8180
          name: http
        envFrom:
        - configMapRef:
            name: circleguard-auth-service-config
        - configMapRef:
            name: circleguard-infra-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.stage.svc.cluster.local:5432/circleguard_stage"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: circleguard-auth-service-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circleguard-auth-service-secret
              key: SPRING_DATASOURCE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: circleguard-auth-service-secret
              key: JWT_SECRET
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8180
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8180
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-auth-service
  namespace: stage
spec:
  type: LoadBalancer
  selector:
    app: circleguard-auth-service
  ports:
  - port: 8180
    targetPort: 8180
    name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: circleguard-auth-service-hpa
  namespace: stage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: circleguard-auth-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

