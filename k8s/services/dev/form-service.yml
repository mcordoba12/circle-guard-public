---
# CircleGuard Form Service - DEV Environment
# Port: 8086
# Type: ClusterIP (internal)

apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-form-service-config
  namespace: dev
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_APPLICATION_NAME: "circleguard-form-service"
  SERVER_PORT: "8086"
  LOGGING_LEVEL_COM_CIRCLEGUARD: "DEBUG"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_OUT_OF_ORDER: "true"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.dev.svc.cluster.local:5432/circleguard_form"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker.dev.svc.cluster.local:9092"

---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-form-service-secret
  namespace: dev
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "password"
  JWT_SECRET: "dev-jwt-secret-key-circleguard-form-service-12345"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-form-service
  namespace: dev
  labels:
    app: circleguard-form-service
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-form-service
  template:
    metadata:
      labels:
        app: circleguard-form-service
        environment: dev
    spec:
      serviceAccountName: circleguard-sa
      containers:
      - name: form-service
        image: angela912/circleguard-form-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: circleguard-form-service-config
        - configMapRef:
            name: circleguard-infra-config
        env:
        - name: SPRING_FLYWAY_ENABLED
          value: "false"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres.dev.svc.cluster.local:5432/circleguard"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: circleguard-form-service-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circleguard-form-service-secret
              key: SPRING_DATASOURCE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: circleguard-form-service-secret
              key: JWT_SECRET
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
      imagePullSecrets:
      - name: acr-credentials
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-form-service
  namespace: dev
  labels:
    app: circleguard-form-service
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: circleguard-form-service
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP
    name: http
