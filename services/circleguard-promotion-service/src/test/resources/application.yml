spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: "test-secret-key-for-testing-purposes-minimum-32-chars-long"
  expiration: 3600000

qr:
  secret: "test-qr-secret-key-for-testing-purposes-minimum-32-chars"
  expiration: 300
