# TestContainers Configuration for Docker Desktop TCP
# Force using Docker TCP connection
docker.client.strategy=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy
DOCKER_HOST=tcp://localhost:2375

# Alternative strategies in order
testcontainers.docker.client.strategy.order=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy,org.testcontainers.dockerclient.DockerClientConfigStrategy,org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy

# Docker daemon configuration
testcontainers.host.override=localhost:2375
